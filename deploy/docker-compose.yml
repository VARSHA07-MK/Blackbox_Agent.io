# Local development stack (docs/09 §4).
services:
  api:
    build: ../backend
    env_file: ../.env
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]
  worker:
    build: ../backend
    command: python -m blackbox.worker
    env_file: ../.env
    depends_on: [postgres, redis, minio]
    deploy: { replicas: 2 }
  web:
    build: ../frontend
    ports: ["5173:80"]
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env} }
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    volumes: [minio:/data]
volumes: { pgdata: {}, minio: {} }
