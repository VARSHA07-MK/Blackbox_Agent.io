[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "blackbox-client"
version = "0.1.0"
description = "Python client and framework adapters for Blackbox for Agents"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.1"]
openai = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blackbox_client*"]
